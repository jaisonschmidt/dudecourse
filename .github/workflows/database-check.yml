name: Database checks

on:
  pull_request:
    paths:
      - '.github/workflows/database-*.yml'
      - 'libs/database/**'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/database-*.yml'
      - 'libs/database/**'
      - 'package-lock.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dudecourse_ci
          POSTGRES_PASSWORD: dudecourse
          POSTGRES_USER: dudecourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dudecourse -d dudecourse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dudecourse:dudecourse@localhost:5432/dudecourse_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://dudecourse:dudecourse@localhost:5432/dudecourse_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - name: Check migration drift
        shell: bash
        run: |
          if find libs/database/prisma/migrations -mindepth 2 -name migration.sql -print -quit 2>/dev/null | grep -q .; then
            docker exec ${{ job.services.postgres.id }} createdb -U dudecourse dudecourse_shadow
            npx prisma migrate diff \
              --from-migrations libs/database/prisma/migrations \
              --to-schema-datamodel libs/database/prisma/schema.prisma \
              --shadow-database-url "$SHADOW_DATABASE_URL" \
              --exit-code
          else
            echo "No committed migrations yet; schema validation is sufficient."
          fi
      - run: npx nx lint database
      - run: npx nx test database
      - run: npx nx build database
