name: Seed HML database

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit containing the seed data
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: database-seed-hml
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: hml
    env:
      APP_ENV: hml
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:seed
